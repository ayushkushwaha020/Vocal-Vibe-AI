name: VocalVibe quality checks

on:
  push:
    paths:
      - "api/**"
      - "index.html"
      - "server.js"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - "index.html"
      - "server.js"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/api-tests.yml"

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Node server syntax
        run: node --check server.js
      - name: Check inline browser JavaScript and API wiring
        run: python scripts/check_frontend.py

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt
      - name: Run API tests
        run: pytest api/tests -q
        env:
          PYTHONPATH: api
